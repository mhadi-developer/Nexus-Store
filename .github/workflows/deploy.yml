name: Deploy — Frontend to Netlify & Backend to Render

on:
  push:
    branches:
      - main
  workflow_dispatch: # manual trigger from the GitHub Actions UI

jobs:
  # ──────────────────────────────────────────────────────────────
  # JOB 0: Detect which folders changed
  # Both deploy jobs read its output to decide whether to run.
  # On a manual trigger (workflow_dispatch) both are always true.
  # ──────────────────────────────────────────────────────────────
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - "frontend/**"
            backend:
              - "backend/**"

  # ──────────────────────────────────────────────────────────────
  # JOB 1: Deploy Frontend → Netlify
  # ──────────────────────────────────────────────────────────────
  deploy-frontend:
    name: 🚀 Frontend → Netlify
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Secret: VITE_BACKEND_URL → https://<your-render-service>.onrender.com/api
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: frontend/dist
          production-branch: main
          production-deploy: true
          deploy-message: "Deploy ${{ github.sha }}"
          enable-pull-request-comment: false
          enable-commit-comment: false
        env:
          # Secret: NETLIFY_AUTH_TOKEN → Netlify → User settings → Personal access tokens
          # Secret: NETLIFY_SITE_ID    → Netlify → Site settings → General → Site ID
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  # ──────────────────────────────────────────────────────────────
  # JOB 2: Deploy Backend → Render
  # ──────────────────────────────────────────────────────────────
  deploy-backend:
    name: 🚀 Backend → Render
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.23"
          enable-cache: true  # Speeds up subsequent workflow runs by caching dependencies

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen --no-dev --no-install-project  # --no-install-project fixes the missing module error

      # Uncomment once you have real tests:
      # - name: Run tests
      #   working-directory: backend
      #   run: uv run pytest src/test -v
      #   env:
      #     DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      #     SECRET_KEY: test-secret-key
      #     STRIPE_PUBLIC_KEY: pk_test_placeholder
      #     STRIPE_SECRET_KEY: sk_test_placeholder
      #     STRIPE_WEBHOOK_SECRET: whsec_placeholder

      - name: Trigger Render Deploy
        # Secret: RENDER_DEPLOY_HOOK_URL → Render → Service → Settings → Deploy Hook
        run: curl --fail-with-body -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Done
        run: echo "✅ Render deployment triggered — track it at https://dashboard.render.com"