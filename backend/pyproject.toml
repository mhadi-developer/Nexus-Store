[project]
name = "fastapis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Muhammad Hadi", email = "hadiquershi08@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi[standard]>=0.142.2",
    "passlib[argon2,bcrypt]>=1.7.4",
    "pydantic[settings]>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.3",
    "config>=0.5.1",
    "email-validator>=2.3.0",
    "pillow>=13.0.0",
    "redis>=8.1.0",
]

[project.scripts]
fastapis = "fastapis:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
